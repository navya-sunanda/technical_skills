
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Library Management System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fb;
    color: #263238;
}

.login-screen {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #14213d, #1d4ed8);
}

.login-card {
    background: white;
    padding: 40px;
    width: 380px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 15px 40px #0003;
}

.login-card h1 {
    color: #1d4ed8;
    margin-bottom: 10px;
}

.login-card input {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

button {
    cursor: pointer;
    border: none;
    padding: 10px 16px;
    border-radius: 7px;
    background: #2563eb;
    color: white;
}

button:hover {
    opacity: 0.85;
}

.login-card button {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
}

.app {
    display: none;
}

.sidebar {
    position: fixed;
    width: 250px;
    height: 100vh;
    background: #14213d;
    color: white;
    padding: 20px;
    overflow-y: auto;
}

.sidebar h2 {
    margin-bottom: 25px;
    color: #93c5fd;
}

.sidebar button {
    width: 100%;
    text-align: left;
    background: transparent;
    padding: 13px;
    margin: 4px 0;
    color: white;
}

.sidebar button:hover,
.sidebar button.active {
    background: #2563eb;
}

.main {
    margin-left: 250px;
    padding: 30px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 3px 10px #00000010;
}

.card h3 {
    color: #64748b;
    font-size: 14px;
}

.card h1 {
    margin-top: 15px;
    color: #2563eb;
}

.section {
    background: white;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 3px 10px #00000010;
}

.section h2 {
    margin-bottom: 20px;
}

.form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

.form input,
.form select {
    flex: 1;
    min-width: 150px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #eff6ff;
    color: #1d4ed8;
}

.delete {
    background: #dc2626;
}

.green {
    background: #16a34a;
}

.orange {
    background: #ea580c;
}

.search {
    padding: 12px;
    width: 100%;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 7px;
}

.book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.book {
    background: #eff6ff;
    border-radius: 12px;
    padding: 20px;
}

.book .icon {
    font-size: 35px;
}

.book h3 {
    margin: 10px 0;
}

.book p {
    margin: 5px 0;
    color: #64748b;
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    background: #dcfce7;
    color: #166534;
    font-size: 12px;
}

.badge.red {
    background: #fee2e2;
    color: #991b1b;
}

#content {
    min-height: 500px;
}

@media(max-width: 700px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
        padding: 15px;
    }

    .sidebar button {
        display: inline-block;
        width: auto;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div class="login-screen" id="loginScreen">

    <div class="login-card">

        <div style="font-size:60px;">📚</div>

        <h1>Smart Library</h1>

        <p>Library Management System</p>

        <input type="text" id="username"
               placeholder="Username">

        <input type="password" id="password"
               placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="loginMessage" style="color:red;margin-top:15px;"></p>

        <p style="margin-top:20px;font-size:13px;">
            Demo: admin / admin123
        </p>

    </div>

</div>

<!-- MAIN APPLICATION -->

<div class="app" id="app">

    <div class="sidebar">

        <h2>📚 Smart Library</h2>

        <button onclick="showPage('dashboard')">🏠 Dashboard</button>
        <button onclick="showPage('books')">📖 Book Management</button>
        <button onclick="showPage('students')">👨‍🎓 Students</button>
        <button onclick="showPage('issue')">📤 Issue Books</button>
        <button onclick="showPage('return')">📥 Return Books</button>
        <button onclick="showPage('search')">🔍 Search Books</button>
        <button onclick="showPage('categories')">📚 Categories</button>
        <button onclick="showPage('fine')">💰 Fine Calculator</button>
        <button onclick="showPage('recommend')">🤖 Recommendations</button>
        <button onclick="showPage('reports')">📊 Reports</button>
        <button onclick="showPage('settings')">⚙️ Settings</button>

        <button onclick="logout()" style="background:#dc2626;margin-top:20px;">
            🚪 Logout
        </button>

    </div>

    <div class="main">

        <div class="topbar">
            <h1 id="pageTitle">Dashboard</h1>
            <span>👤 Admin</span>
        </div>

        <div id="content"></div>

    </div>

</div>

<script>

// DATABASE USING LOCAL STORAGE

let books = JSON.parse(localStorage.getItem("books")) || [
    {id:1, name:"Java Programming", author:"James Gosling", category:"Computer Science", quantity:5},
    {id:2, name:"Python Programming", author:"Guido van Rossum", category:"Computer Science", quantity:4},
    {id:3, name:"Database Management", author:"Korth", category:"Computer Science", quantity:3},
    {id:4, name:"Operating Systems", author:"Galvin", category:"Engineering", quantity:4},
    {id:5, name:"The Alchemist", author:"Paulo Coelho", category:"Novel", quantity:6}
];

let students = JSON.parse(localStorage.getItem("students")) || [];

let issued = JSON.parse(localStorage.getItem("issued")) || [];

function saveData() {
    localStorage.setItem("books", JSON.stringify(books));
    localStorage.setItem("students", JSON.stringify(students));
    localStorage.setItem("issued", JSON.stringify(issued));
}

// LOGIN

function login() {

    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "admin" && pass === "admin123") {

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "block";

        showPage("dashboard");

    } else {

        document.getElementById("loginMessage").innerHTML =
        "Invalid username or password";

    }

}

function logout() {

    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";

}

// PAGE NAVIGATION

function showPage(page) {

    const content = document.getElementById("content");

    document.getElementById("pageTitle").innerText =
    page.charAt(0).toUpperCase() + page.slice(1);

    if(page === "dashboard") dashboard();
    if(page === "books") bookManagement();
    if(page === "students") studentManagement();
    if(page === "issue") issueBooks();
    if(page === "return") returnBooks();
    if(page === "search") searchBooks();
    if(page === "categories") categories();
    if(page === "fine") fineCalculator();
    if(page === "recommend") recommendations();
    if(page === "reports") reports();
    if(page === "settings") settings();

}

// DASHBOARD

function dashboard() {

    document.getElementById("content").innerHTML = `

    <div class="cards">

        <div class="card">
            <h3>📚 Total Books</h3>
            <h1>${books.length}</h1>
        </div>

        <div class="card">
            <h3>📖 Available Copies</h3>
            <h1>${books.reduce((s,b)=>s+b.quantity,0)}</h1>
        </div>

        <div class="card">
            <h3>📤 Issued Books</h3>
            <h1>${issued.length}</h1>
        </div>

        <div class="card">
            <h3>👨‍🎓 Students</h3>
            <h1>${students.length}</h1>
        </div>

    </div>

    <div class="section">

        <h2>Welcome to Smart Library 📚</h2>

        <p>
        Manage books, students, book issue and returns
        from one simple application.
        </p>

        <br>

        <div class="book-grid">

            <div class="book">
                <div class="icon">📚</div>
                <h3>Book Collection</h3>
                <p>Manage your library books.</p>
            </div>

            <div class="book">
                <div class="icon">👨‍🎓</div>
                <h3>Student Records</h3>
                <p>Maintain student information.</p>
            </div>

            <div class="book">
                <div class="icon">📤</div>
                <h3>Issue & Return</h3>
                <p>Track borrowed books.</p>
            </div>

            <div class="book">
                <div class="icon">🤖</div>
                <h3>Recommendations</h3>
                <p>Discover popular books.</p>
            </div>

        </div>

    </div>

    `;

}

// BOOK MANAGEMENT

function bookManagement() {

    document.getElementById("content").innerHTML = `

    <div class="section">

        <h2>➕ Add New Book</h2>

        <div class="form">

            <input id="bookName" placeholder="Book Name">

            <input id="bookAuthor" placeholder="Author">

            <input id="bookCategory" placeholder="Category">

            <input id="bookQuantity" type="number"
                   placeholder="Quantity">

            <button onclick="addBook()">Add Book</button>

        </div>

    </div>

    <div class="section">

        <h2>📖 Book Collection</h2>

        <input class="search" placeholder="Search books..."
               oninput="renderBooks(this.value)">

        <div id="bookList"></div>

    </div>

    `;

    renderBooks();

}

function addBook() {

    let name = document.getElementById("bookName").value;
    let author = document.getElementById("bookAuthor").value;
    let category = document.getElementById("bookCategory").value;
    let quantity = Number(document.getElementById("bookQuantity").value);

    if(!name || !author || !category || quantity <= 0) {
        alert("Please enter all book details.");
        return;
    }

    books.push({
        id:Date.now(),
        name,
        author,
        category,
        quantity
    });

    saveData();

    bookManagement();

}

function renderBooks(search="") {

    let filtered = books.filter(b =>
        b.name.toLowerCase().includes(search.toLowerCase()) ||
        b.author.toLowerCase().includes(search.toLowerCase()) ||
        b.category.toLowerCase().includes(search.toLowerCase())
    );

    document.getElementById("bookList").innerHTML = `

    <table>

        <tr>
            <th>ID</th>
            <th>Book Name</th>
            <th>Author</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>

        ${filtered.map(b=>`

        <tr>
            <td>${b.id}</td>
            <td>${b.name}</td>
            <td>${b.author}</td>
            <td>${b.category}</td>
            <td>${b.quantity}</td>
            <td>
                <button class="delete"
                onclick="deleteBook(${b.id})">
                Delete
                </button>
            </td>
        </tr>

        `).join("")}

    </table>

    `;

}

function deleteBook(id) {

    if(confirm("Delete this book?")) {

        books = books.filter(b=>b.id!==id);

        saveData();

        bookManagement();

    }

}

// STUDENT MANAGEMENT

function studentManagement() {

    document.getElementById("content").innerHTML = `

    <div class="section">

        <h2>➕ Register Student</h2>

        <div class="form">

            <input id="studentName" placeholder="Student Name">

            <input id="studentId" placeholder="Student ID">

            <input id="studentDept" placeholder="Department">

            <input id="studentEmail" placeholder="Email">

            <button onclick="addStudent()">Register Student</button>

        </div>

    </div>

    <div class="section">

        <h2>👨‍🎓 Student Records</h2>

        <div id="studentList"></div>

    </div>

    `;

    renderStudents();

}

function addStudent() {

    let name = document.getElementById("studentName").value;
    let id = document.getElementById("studentId").value;
    let dept = document.getElementById("studentDept").value;
    let email = document.getElementById("studentEmail").value;

    if(!name || !id || !dept || !email) {
        alert("Enter all student details");
        return;
    }

    students.push({name,id,dept,email});

    saveData();

    studentManagement();

}

function renderStudents() {

    document.getElementById("studentList").innerHTML = `

    <table>

    <tr>
        <th>Name</th>
        <th>Student ID</th>
        <th>Department</th>
        <th>Email</th>
        <th>Action</th>
    </tr>

    ${students.map(s=>`

    <tr>
        <td>${s.name}</td>
        <td>${s.id}</td>
        <td>${s.dept}</td>
        <td>${s.email}</td>
        <td>
            <button class="delete"
            onclick="deleteStudent('${s.id}')">
            Delete
            </button>
        </td>
    </tr>

    `).join("")}

    </table>

    `;

}

function deleteStudent(id) {

    students = students.filter(s=>s.id!==id);

    saveData();

    studentManagement();

}

// ISSUE BOOKS

function issueBooks() {

    document.getElementById("content").innerHTML = `

    <div class="section">

        <h2>📤 Issue Book</h2>

        <div class="form">

            <input id="issueStudent"
                   placeholder="Student ID">

            <select id="issueBook">

                ${books.map(b=>`

                <option value="${b.id}">
                ${b.name} (Available: ${b.quantity})
                </option>

                `).join("")}

            </select>

            <button onclick="issueBook()">Issue Book</button>

        </div>

    </div>

    <div class="section">

        <h2>📋 Issue History</h2>

        ${issued.map(i=>`

        <p>
        ${i.student} — ${i.book} —
        ${i.date} —
        <span class="badge red">Issued</span>
        </p>

        `).join("")}

    </div>

    `;

}

function issueBook() {

    let student = document.getElementById("issueStudent").value;
    let bookId = Number(document.getElementById("issueBook").value);

    let book = books.find(b=>b.id===bookId);

    if(!student) {
        alert("Enter Student ID");
        return;
    }

    if(!book || book.quantity <= 0) {
        alert("Book is not available");
        return;
    }

    book.quantity--;

    issued.push({
        student,
        book:book.name,
        bookId,
        date:new Date().toLocaleDateString()
    });

    saveData();

    issueBooks();

    alert("Book issued successfully!");

}

// RETURN BOOKS

function returnBooks() {

    document.getElementById("content").innerHTML = `

    <div class="section">

        <h2>📥 Return Book</h2>

        <div id="returnList"></div>

    </div>

    `;

    document.getElementById("returnList").innerHTML = `

    <table>

    <tr>
        <th>Student ID</th>
        <th>Book</th>
        <th>Issue Date</th>
        <th>Action</th>
    </tr>

    ${issued.map((i,index)=>`

    <tr>
        <td>${i.student}</td>
        <td>${i.book}</td>
        <td>${i.date}</td>
        <td>
            <button class="green"
            onclick="returnBook(${index})">
            Return
            </button>
        </td>
    </tr>

    `).join("")}

    </table>

    `;

}

function returnBook(index) {

    let item = issued[index];

    let book = books.find(b=>b.id===item.bookId);

    if(book) book.quantity++;

    issued.splice(index,1);

    saveData();

    returnBooks();

    alert("Book returned successfully!");

}

// SEARCH BOOKS

function searchBooks() {

    document.getElementById("content").innerHTML = `

    <div class="section">

        <h2>🔍 Search Books</h2>

        <input class="search"
        placeholder="Search by name, author or category..."
        oninput="searchBookResults(this.value)">

        <div id="searchResults" class="book-grid"></div>

    </div>

    `;

    searchBookResults("");

}

function searchBookResults(query) {

    let result = books.filter(b=>
        b.name.toLowerCase().includes(query.toLowerCase()) ||
        b.author.toLowerCase().includes(query.toLowerCase()) ||
        b.category.toLowerCase().includes(query.toLowerCase())
    );

    document.getElementById("searchResults").innerHTML =
    result.map(b=>`

    <div class="book">

        <div class="icon">📘</div>

        <h3>${b.name}</h3>

        <p>Author: ${b.author}</p>

        <p>Category: ${b.category}</p>

        <p>Available: ${b.quantity}</p>

        <span class="badge">
        ${b.quantity>0?"Available":"Unavailable"}
        </span>

    </div>

    `).join("");

}

// CATEGORIES

function categories() {

    let categoryList = [...new Set(books.map(b=>b.category))];

    document.getElementById("content").innerHTML = `

    <div class="section">

        <h2>📚 Book Categories</h2>

        <div class="book-grid">

        ${categoryList.map(c=>`

        <div class="book">

            <div class="icon">📚</div>

            <h3>${c}</h3>

            <p>
            ${books.filter(b=>b.category===c).length}
            Books
            </p>

        </div>

        `).join("")}

        </div>

    </div>

    `;

}

// FINE CALCULATOR

function fineCalculator() {

    document.getElementById("content").innerHTML = `

    <div class="section">

        <h2>💰 Fine Calculator</h2>

        <p>Fine rate: ₹5 per overdue day</p>

        <br>

        <div class="form">

            <input id="days" type="number"
                   placeholder="Number of overdue days">

            <button onclick="calculateFine()">
            Calculate Fine
            </button>

        </div>

        <h2 id="fineResult"></h2>

    </div>

    `;

}

function calculateFine() {

    let days = Number(document.getElementById("days").value);

    let fine = days > 0 ? days*5 : 0;

    document.getElementById("fineResult").innerHTML =
    "Total Fine: ₹" + fine;

}

// RECOMMENDATIONS

function recommendations() {

    document.getElementById("content").innerHTML = `

    <div class="section">

        <h2>🤖 Book Recommendations</h2>

        <p>
        Popular books and recommendations based on categories.
        </p>

        <br>

        <div class="book-grid">

        ${books.map(b=>`

        <div class="book">

            <div class="icon">📖</div>

            <h3>${b.name}</h3>

            <p>Author: ${b.author}</p>

            <p>Category: ${b.category}</p>

            <span class="badge">
            Recommended
            </span>

        </div>

        `).join("")}

        </div>

    </div>

    `;

}

// REPORTS

function reports() {

    document.getElementById("content").innerHTML = `

    <div class="section">

        <h2>📊 Library Reports</h2>

        <div class="cards">

            <div class="card">
                <h3>Total Books</h3>
                <h1>${books.length}</h1>
            </div>

            <div class="card">
                <h3>Total Students</h3>
                <h1>${students.length}</h1>
            </div>

            <div class="card">
                <h3>Issued Books</h3>
                <h1>${issued.length}</h1>
            </div>

        </div>

        <h3>Book Inventory Report</h3>

        <table>

        <tr>
            <th>Book</th>
            <th>Author</th>
            <th>Category</th>
            <th>Available</th>
        </tr>

        ${books.map(b=>`

        <tr>
            <td>${b.name}</td>
            <td>${b.author}</td>
            <td>${b.category}</td>
            <td>${b.quantity}</td>
        </tr>

        `).join("")}

        </table>

        <br>

        <button onclick="window.print()">
        🖨️ Print Report
        </button>

    </div>

    `;

}

// SETTINGS

function settings() {

    document.getElementById("content").innerHTML = `

    <div class="section">

        <h2>⚙️ Settings</h2>

        <button onclick="changeTheme()">
        🌙 Toggle Dark Mode
        </button>

        <br><br>

        <button class="delete" onclick="clearDatabase()">
        🗑️ Clear All Data
        </button>

        <br><br>

        <h3>Library Information</h3>

        <p>Smart Library Management System</p>

        <p>Version 1.0</p>

        <p>Developed for Academic Mini Project</p>

    </div>

    `;

}

function changeTheme() {

    document.body.style.background =
    document.body.style.background === "black"
    ? "#f4f6fb" : "black";

    document.body.style.color =
    document.body.style.color === "white"
    ? "#263238" : "white";

}

function clearDatabase() {

    if(confirm("Are you sure you want to delete all stored data?")) {

        localStorage.clear();

        books = [];
        students = [];
        issued = [];

        saveData();

        showPage("dashboard");

    }

}

// START

</script>

</body>
</html>
